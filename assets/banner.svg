<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Guilherme Anselmo - Data Science and AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#0E1A18"/>
      <stop offset="100%" stop-color="#0F2A22"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5A0"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#00E5A0" stroke-width="0.5" opacity="0.07"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="round">
      <rect width="900" height="220" rx="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="220" fill="url(#bg)"/>
    <rect width="900" height="220" fill="url(#grid)"/>

    <!-- ambient glow -->
    <circle cx="800" cy="40" r="110" fill="#00E5A0" opacity="0.08" filter="url(#glow)">
      <animate attributeName="opacity" values="0.05;0.13;0.05" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- scattered data points -->
    <g fill="#00E5A0">
      <circle cx="700" cy="150" r="2.5" opacity="0.5">
        <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="745" cy="115" r="2" opacity="0.4">
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="4.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="790" cy="165" r="3" opacity="0.6">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="835" cy="125" r="2" opacity="0.35">
        <animate attributeName="opacity" values="0.15;0.75;0.15" dur="5.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="660" cy="180" r="1.8" opacity="0.3">
        <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <path d="M660 180 L700 150 L745 115 L790 165 L835 125" fill="none" stroke="#00E5A0"
          stroke-width="1.2" opacity="0.22" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- terminal prompt -->
    <text x="52" y="58" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, monospace"
          font-size="15" fill="#00E5A0" opacity="0.75">gilas-byte@github:~$ whoami</text>

    <!-- name -->
    <text x="50" y="115" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, monospace"
          font-size="42" font-weight="700" fill="#F0F6FC" letter-spacing="-0.5">Guilherme Anselmo</text>

    <!-- subtitle + blinking cursor -->
    <text x="52" y="152" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, monospace"
          font-size="17" fill="#8B949E">Data Science &amp; AI &#183; Florian&#243;polis, BR</text>
    <rect x="405" y="138" width="10" height="19" fill="#00E5A0">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- tag line -->
    <text x="52" y="186" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Consolas, monospace"
          font-size="13" fill="#00E5A0" opacity="0.85">python &#183; sql &#183; fastapi &#183; streamlit &#183; docker</text>

    <!-- accent bar -->
    <rect x="0" y="212" width="900" height="8" fill="url(#accent)" opacity="0.9"/>
  </g>
</svg>
