name: Update README cards

on:
  # Every day at 06:00 UTC (03:00 in Florianópolis)
  schedule:
    - cron: "0 6 * * *"
  # Lets you run it by hand from the Actions tab — use this for the first run
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=gilas-byte&show_icons=true&hide_border=true&title_color=00E5A0&icon_color=00E5A0&text_color=c9d1d9&bg_color=0D1117
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          # exclude_repo drops the Jupyter coursework repo, whose saved notebook
          # output would otherwise dominate the chart by byte count
          card: top-langs
          options: username=gilas-byte&layout=compact&langs_count=8&exclude_repo=aulas-b.i.&hide_border=true&title_color=00E5A0&text_color=c9d1d9&bg_color=0D1117
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
